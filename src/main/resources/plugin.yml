name: CheeseUtils
main: com.faboit.cheeseutils.CheeseUtilsPlugin
version: 1.0.0
api-version: '1.21'
authors: [Faboit1]
description: Donut-style utility plugin bundle with combat, homes, warps, tpa, settings, daily and migration tools.
softdepend: [PlaceholderAPI, Vault, DecentHolograms]
commands:
  combatstatus:
    usage: /combatstatus
  combatreload:
    usage: /combatreload
    permission: cheeseutils.combat.reload
  tpa:
    usage: /tpa <player>
  tpahere:
    usage: /tpahere <player>
  tpaccept:
    usage: /tpaccept
  tpdeny:
    usage: /tpdeny
  tpauto:
    usage: /tpauto
  tpatoggle:
    usage: /tpatoggle
  tpaheretoggle:
    usage: /tpaheretoggle
  tpaguitoggle:
    usage: /tpaguitoggle
  setspawn:
    usage: /setspawn
    permission: cheeseutils.spawn.set
  spawn:
    usage: /spawn
  setwarp:
    usage: /setwarp <name> [category]
    permission: cheeseutils.warp.admin
  warp:
    usage: /warp <name>
  delwarp:
    usage: /delwarp <name>
    permission: cheeseutils.warp.admin
  warps:
    usage: /warps
  daily:
    usage: /daily
  pay:
    usage: /pay <player> <amount>
  paytoggle:
    usage: /paytoggle
  payblock:
    usage: /payblock
  home:
    usage: /home <name>
  sethome:
    usage: /sethome <name>
  delhome:
    usage: /delhome <name>
  homes:
    usage: /homes
  settings:
    usage: /settings
permissions:
  cheeseutils.admin:
    description: Grants all CheeseUtils permissions.
    default: op
    children:
      cheeseutils.combat.bypass: true
      cheeseutils.combat.reload: true
      cheeseutils.spawn.set: true
      cheeseutils.warp.admin: true
      cheeseutils.pay.bypasslimit: true
      cheeseutils.homes.max.100: true
  cheeseutils.combat.bypass:
    default: false
  cheeseutils.combat.reload:
    default: op
  cheeseutils.spawn.set:
    default: op
  cheeseutils.warp.admin:
    default: op
  cheeseutils.pay.bypasslimit:
    default: false
